# --- Identificação ---
sonar.projectKey=b3datetime
sonar.projectName=b3datetime

# --- Layout ---
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# --- Python ---
# A versão do runtime implantado (ver Dockerfile), não a matriz de teste: o
# analisador deve raciocinar sobre o interpretador que roda em produção.
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=junit.xml

# --- Exclusões de análise ---
# .history/ é ruído do VS Code Local History: dezenas de cópias quase idênticas de
# main.py e dates.py. É gitignored, então não existe no checkout do CI, mas está no
# disco em execuções locais do sonar-scanner e via integração de IDE/MCP, onde
# destruiria a métrica de duplicação.
# src/static/ são assets de terceiros versionados (Swagger UI e ReDoc minificados).
sonar.exclusions=\
  .history/**,\
  src/static/**/*.js,\
  src/static/**/*.css,\
  htmlcov/**,\
  .venv/**,\
  venv/**,\
  **/__pycache__/**

# --- Exclusões de duplicação ---
sonar.cpd.exclusions=\
  tests/**,\
  src/routers/openapi_examples.py

# --- Exclusões de cobertura ---
# tests/ já está fora de sonar.sources. __main__.py é entrypoint de desenvolvimento.
sonar.coverage.exclusions=\
  src/__main__.py,\
  src/static/**

# --- SCM: necessário para atribuição correta de "new code" ---
sonar.scm.provider=git

# NÃO definir sonar.projectBaseDir: o default (cwd do scanner) é o que faz os
# caminhos de coverage.xml resolverem contra sonar.sources.
