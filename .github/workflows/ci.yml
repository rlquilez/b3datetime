name: CI

# Sem trigger de tags: quem trata tags é o release.yml. É assim que a publicação
# dupla da imagem é evitada estruturalmente, e não por convenção.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Só cancela em PR: um publish da main nunca deve ser morto no meio.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . --output-format=github
      - run: ruff format --check .

  typecheck:
    name: Tipagem (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: mypy src

  test:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 3.11 = mínimo suportado (requires-python); 3.14 = runtime da imagem.
      matrix:
        python-version: ["3.11", "3.14"]
    services:
      # Cobre os testes de contrato contra Redis real, que são a única defesa
      # contra drift do fakeredis exatamente na semântica que corrigimos
      # (string vazia devolvida como "" e não None, decode_responses).
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: pytest
        run: python -m pytest

      # Tripwire permanente do 0% de coverage no SonarQube: se os caminhos do
      # coverage.xml deixarem de ser relativos à raiz, o Sonar não casa com
      # sonar.sources e reporta 0% silenciosamente.
      - name: Verificar caminhos do coverage.xml
        run: |
          if ! grep -q 'filename="src/' coverage.xml; then
            echo "::error::coverage.xml sem caminhos 'src/...'; o SonarQube reportaria 0%"
            grep -o 'filename="[^"]*"' coverage.xml | head -5
            exit 1
          fi
          echo "OK: $(grep -c 'filename="src/' coverage.xml) arquivos com caminho relativo à raiz"

      # Tripwire: com o service de Redis disponível, nada pode ser pulado — os testes
      # `slow` e `integration` precisam ter executado de fato, senão "suíte completa"
      # vira só uma intenção.
      - name: Nenhum teste pulado no CI
        run: |
          if grep -qE 'skipped="[1-9][0-9]*"' junit.xml; then
            echo "::error::junit.xml registra testes pulados; a suíte completa não executou"
            grep -oE 'skipped="[0-9]+"' junit.xml | sort | uniq -c
            exit 1
          fi
          echo "OK: nenhum teste pulado ($(grep -oE 'tests="[0-9]+"' junit.xml | head -1))"

      - name: Publicar relatórios
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: error

  sonar:
    name: SonarQube
    needs: [test]
    runs-on: ubuntu-latest
    # PRs de fork e PRs do Dependabot não têm acesso aos secrets (SONAR_HOST_URL chega
    # vazio); sem este guard o job falharia de forma confusa em vez de ser pulado, e
    # todo PR do Dependabot ficava vermelho no ci-ok.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v7
        with:
          # Clone raso quebra o git blame, que quebra a atribuição de new code,
          # que torna as métricas de new code do quality gate sem sentido.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: .

      # Tripwire: sem os relatórios, o scanner roda e o Sonar reporta 0% em silêncio.
      - name: Relatórios de coverage e testes presentes
        run: ls -l coverage.xml junit.xml

      # Gate bloqueante. A primeira análise (commit 4cdd874) estabeleceu o baseline
      # e passou com new_coverage 100%, duplicação 0% e 0 violations, e o projeto
      # não tem security hotspots — então o gate pôde ser fechado depois de ter
      # sido observado passando, e não antes.
      - name: Análise e quality gate
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600

  bandit:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: bandit
        run: bandit -r src -c pyproject.toml -f sarif -o bandit.sarif --exit-zero
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          category: bandit
        # Caminho de relato, não de decisão: quem reprova o build é o passo de scan
        # bloqueante. Uma indisponibilidade do endpoint de code scanning do GitHub
        # não deve derrubar um scan que passou.
        continue-on-error: true
      - name: Falhar em achado de severidade alta
        run: bandit -r src -c pyproject.toml -ll

  pip-audit:
    name: CVEs em dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt requirements-dev.txt

  dependency-review:
    name: Revisão de dependências
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  secret-scan:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # o histórico inteiro é o ponto da varredura
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  trivy-fs:
    name: Trivy (filesystem)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # Duas invocações: a primeira com exit-code 0 garante que o SARIF sempre
      # sobe; a segunda é a que efetivamente reprova o build.
      - name: Trivy (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"
        env:
          TRIVY_SKIP_DB_UPDATE: false
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
        # Caminho de relato, não de decisão: quem reprova o build é o passo de scan
        # bloqueante. Uma indisponibilidade do endpoint de code scanning do GitHub
        # não deve derrubar um scan que passou.
        continue-on-error: true

      - name: Trivy (bloqueante)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  docker-verify:
    name: Build e scan da imagem
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Build só de amd64 com load: true. Um build multi-arch com --push não
      # deixa nada localmente para o Trivy escanear. Sem secrets, este job
      # também funciona em PR de fork.
      - name: Build local (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: b3datetime:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # O container real, como roda em produção: sem Redis (health 503), depois com
      # Redis real e ROOT_PATH nas duas formas em que o Kong entrega o caminho, todas
      # as páginas, assets e endpoints, barra final, casos negativos e o HEALTHCHECK.
      # O mesmo script roda localmente: IMAGE=b3datetime:ci scripts/smoke_image.sh
      - name: Smoke test da imagem (sem Redis; Redis real + prefixo; HEALTHCHECK)
        run: IMAGE=b3datetime:ci bash scripts/smoke_image.sh

      - name: Limpeza dos containers do smoke test
        if: always()
        run: docker rm -f smoke-app smoke-redis >/dev/null 2>&1 || true

      - name: Trivy na imagem (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: b3datetime:ci
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
        # Caminho de relato, não de decisão: quem reprova o build é o passo de scan
        # bloqueante. Uma indisponibilidade do endpoint de code scanning do GitHub
        # não deve derrubar um scan que passou.
        continue-on-error: true

      - name: Trivy na imagem (bloqueante)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: b3datetime:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  docker-publish:
    name: Publicar imagem
    # Nenhuma imagem é publicada sem lint, tipagem, testes, scan da imagem e
    # quality gate aprovado.
    needs: [docker-verify, sonar]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /toolcache
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Gerar metadados da imagem
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.GIT_REGISTRY }}/${{ secrets.GIT_OWNER }}/b3datetime
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      - name: Login no Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.GIT_REGISTRY_USER }}
          password: ${{ secrets.GIT_REGISTRY_PASSWORD }}
          registry: ${{ secrets.GIT_REGISTRY }}

      - name: Habilitar QEMU (multi-arquitetura)
        uses: docker/setup-qemu-action@v4
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir e enviar imagem multi-arch
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sbom:
    name: SBOM
    needs: [docker-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json

  ci-ok:
    name: CI OK
    # Agregador: é este o único check que precisa ser exigido em branch
    # protection, em vez de enumerar uma dúzia de nomes de job.
    if: always()
    needs:
      - lint
      - typecheck
      - test
      - sonar
      - bandit
      - pip-audit
      - dependency-review
      - secret-scan
      - codeql
      - trivy-fs
      - docker-verify
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultado dos jobs
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          python3 - <<'PY'
          import json, sys
          needs = json.load(open("needs.json"))
          ruim = {n: r["result"] for n, r in needs.items()
                  if r["result"] not in ("success", "skipped")}
          for nome, resultado in sorted(ruim.items()):
              print(f"::error::job '{nome}' terminou como {resultado}")
          if ruim:
              sys.exit(1)
          print("Todos os jobs obrigatórios passaram.")
          PY
