name: CI

# Workflow único do projeto. Sem trigger de tags: as tags de versão são criadas
# pelo job `release`, depois da publicação, a partir da api_version do commit.
# Como nada reage a push de tag, a publicação dupla da imagem continua impossível
# por estrutura, e não por convenção.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Só cancela em PR: um publish da main nunca deve ser morto no meio.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: Lint · ruff
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . --output-format=github
      - run: ruff format --check .

  typecheck:
    name: Tipagem · mypy
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: mypy src

  test:
    # Só o 3.14: é o runtime da imagem e a única versão declarada em requires-python.
    # A matriz com o 3.11 foi removida em #45 — testar uma versão que nenhum ambiente
    # usa custava um job inteiro por push sem proteger nada que é entregue.
    name: Testes · pytest (Python 3.14)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      # Cobre os testes de contrato contra Redis real, que são a única defesa
      # contra drift do fakeredis exatamente na semântica que corrigimos
      # (string vazia devolvida como "" e não None, decode_responses).
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: pytest
        run: python -m pytest

      # Tripwire permanente do 0% de coverage no SonarQube: se os caminhos do
      # coverage.xml deixarem de ser relativos à raiz, o Sonar não casa com
      # sonar.sources e reporta 0% silenciosamente.
      - name: Verificar caminhos do coverage.xml
        run: |
          if ! grep -q 'filename="src/' coverage.xml; then
            echo "::error::coverage.xml sem caminhos 'src/...'; o SonarQube reportaria 0%"
            grep -o 'filename="[^"]*"' coverage.xml | head -5
            exit 1
          fi
          echo "OK: $(grep -c 'filename="src/' coverage.xml) arquivos com caminho relativo à raiz"

      # Tripwire: com o service de Redis disponível, nada pode ser pulado — os testes
      # `slow` e `integration` precisam ter executado de fato, senão "suíte completa"
      # vira só uma intenção.
      - name: Nenhum teste pulado no CI
        run: |
          if grep -qE 'skipped="[1-9][0-9]*"' junit.xml; then
            echo "::error::junit.xml registra testes pulados; a suíte completa não executou"
            grep -oE 'skipped="[0-9]+"' junit.xml | sort | uniq -c
            exit 1
          fi
          echo "OK: nenhum teste pulado ($(grep -oE 'tests="[0-9]+"' junit.xml | head -1))"

      - name: Publicar relatórios
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: error

  sonar:
    name: Qualidade · SonarQube
    timeout-minutes: 20
    needs: [test]
    runs-on: ubuntu-latest
    # PRs de fork e PRs do Dependabot não têm acesso aos secrets (SONAR_HOST_URL chega
    # vazio); sem este guard o job falharia de forma confusa em vez de ser pulado, e
    # todo PR do Dependabot ficava vermelho no ci-ok.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Clone raso quebra o git blame, que quebra a atribuição de new code,
          # que torna as métricas de new code do quality gate sem sentido.
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: .

      # Tripwire: sem os relatórios, o scanner roda e o Sonar reporta 0% em silêncio.
      - name: Relatórios de coverage e testes presentes
        run: ls -l coverage.xml junit.xml

      # Gate bloqueante. A primeira análise (commit 4cdd874) estabeleceu o baseline
      # e passou com new_coverage 100%, duplicação 0% e 0 violations, e o projeto
      # não tem security hotspots — então o gate pôde ser fechado depois de ter
      # sido observado passando, e não antes.
      - name: Análise e quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600

  bandit:
    name: SAST · bandit
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: bandit
        run: bandit -r src -c pyproject.toml -f sarif -o bandit.sarif --exit-zero
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: bandit.sarif
          category: bandit
        # Caminho de relato, não de decisão: quem reprova o build é o passo de scan
        # bloqueante. Uma indisponibilidade do endpoint de code scanning do GitHub
        # não deve derrubar um scan que passou.
        continue-on-error: true
      - name: Falhar em achado de severidade alta
        run: bandit -r src -c pyproject.toml -ll

  pip-audit:
    name: SCA · pip-audit
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt requirements-dev.txt

  dependency-review:
    name: SCA · dependency-review
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secret-scan:
    name: Segredos · gitleaks
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # o histórico inteiro é o ponto da varredura
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: SAST · CodeQL
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:python"

  trivy-fs:
    name: SCA · Trivy (filesystem)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Duas invocações: a primeira com exit-code 0 garante que o SARIF sempre
      # sobe; a segunda é a que efetivamente reprova o build.
      - name: Trivy (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"
        env:
          TRIVY_SKIP_DB_UPDATE: false
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
        # Caminho de relato, não de decisão: quem reprova o build é o passo de scan
        # bloqueante. Uma indisponibilidade do endpoint de code scanning do GitHub
        # não deve derrubar um scan que passou.
        continue-on-error: true

      - name: Trivy (bloqueante)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  docker-verify:
    name: Imagem · build, smoke e Trivy
    timeout-minutes: 30
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      apk-refresh: ${{ steps.refresh.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Chave que invalida a camada `apk upgrade` do Dockerfile a cada execução.
      # Sem ela, o cache do GHA reaproveitava a camada de upgrade enquanto o digest
      # da base não mudava: com a base Debian, os patches publicados depois nunca
      # entraram e o Trivy bloqueante passou a reprovar todo build (#39). O
      # docker-publish recebe esta mesma chave, então a camada amd64 publicada é
      # exatamente a escaneada aqui — inclusive em "re-run failed jobs", que
      # preserva os outputs deste job.
      - name: Chave de atualização do apk
        id: refresh
        run: echo "value=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      # Build só de amd64 com load: true. Um build multi-arch com --push não
      # deixa nada localmente para o Trivy escanear. Sem secrets, este job
      # também funciona em PR de fork.
      # Escopo de cache próprio: o índice do cache do GHA é "último que escreve
      # vence" por escopo, e o export só de amd64 deste job apagava as entradas
      # arm64 do docker-publish, que refazia o pip install arm64 sob QEMU (~200 s)
      # em todo publish.
      - name: Build local (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: b3datetime:ci
          build-args: APK_REFRESH=${{ steps.refresh.outputs.value }}
          cache-from: type=gha,scope=verify
          cache-to: type=gha,mode=max,scope=verify

      # O container real, como roda em produção: sem Redis (health 503), depois com
      # Redis real e ROOT_PATH nas duas formas em que o Kong entrega o caminho, todas
      # as páginas, assets e endpoints, barra final, casos negativos e o HEALTHCHECK.
      # O mesmo script roda localmente: IMAGE=b3datetime:ci scripts/smoke_image.sh
      - name: Smoke test da imagem (sem Redis; Redis real + prefixo; HEALTHCHECK)
        run: IMAGE=b3datetime:ci bash scripts/smoke_image.sh

      - name: Limpeza dos containers do smoke test
        if: always()
        run: docker rm -f smoke-app smoke-redis >/dev/null 2>&1 || true

      - name: Trivy na imagem (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: b3datetime:ci
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
        # Caminho de relato, não de decisão: quem reprova o build é o passo de scan
        # bloqueante. Uma indisponibilidade do endpoint de code scanning do GitHub
        # não deve derrubar um scan que passou.
        continue-on-error: true

      - name: Trivy na imagem (bloqueante)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: b3datetime:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  e2e:
    name: E2E · contrato 100%
    timeout-minutes: 30
    # A suíte tests/e2e contra a imagem real, com Redis real e o calendário BVMF real,
    # em quatro ambientes (principal, sem Redis, sem calendário, Redis que sobe depois).
    # Toda resposta documentada de toda operação do /openapi.json servido tem caso, e
    # um teste exige que os dois conjuntos sejam iguais (#47).
    # Roda em paralelo ao docker-verify, a partir do mesmo Dockerfile e da mesma chave
    # APK_REFRESH. Lê o cache do escopo verify e não grava nenhum, para não disputar o
    # índice com ele.
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build local (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: b3datetime:e2e
          build-args: APK_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=verify

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: E2E contra a imagem
        env:
          E2E_IMAGE: b3datetime:e2e
        run: python -m pytest -m e2e tests/e2e --no-cov --junitxml=e2e-junit.xml

      # Tripwire: em containers, todos os ambientes existem e o Redis é controlável —
      # um caso pulado seria uma resposta documentada sem validação.
      - name: Nenhum teste E2E pulado
        run: |
          if grep -qE 'skipped="[1-9][0-9]*"' e2e-junit.xml; then
            echo "::error::e2e-junit.xml registra testes pulados; a cobertura E2E não está completa"
            grep -oE 'skipped="[0-9]+"' e2e-junit.xml | sort | uniq -c
            exit 1
          fi
          echo "OK: nenhum teste E2E pulado ($(grep -oE 'tests="[0-9]+"' e2e-junit.xml | head -1))"

      - name: Publicar relatório E2E
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: e2e-junit.xml
          if-no-files-found: ignore

  docker-publish:
    name: Entrega · publicar imagem
    timeout-minutes: 45
    # Nenhuma imagem é publicada sem TODOS os blocos aprovados: depende do ci-ok, que
    # agrega cada job de verificação. Antes dependia só de docker-verify, e2e e sonar,
    # e um bandit, CodeQL, gitleaks, Trivy fs ou pip-audit reprovado ainda deixava o
    # `latest` ir para produção. O docker-verify continua listado pelo output
    # apk-refresh, que garante que a camada amd64 publicada é a escaneada.
    needs: [ci-ok, docker-verify]
    # Condição explícita, não o success() implícito: este é avaliado sobre a cadeia
    # TRANSITIVA de needs, e o dependency-review (só em PR) aparece como skipped em todo
    # push — o publish era pulado mesmo com o ci-ok verde. Quem decide se um pulo é
    # aceitável é o ci-ok; aqui basta o resultado dele.
    if: >-
      !cancelled() && github.event_name == 'push' &&
      needs.ci-ok.result == 'success' && needs.docker-verify.result == 'success'
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /toolcache
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A produção puxa `latest` sozinha. Re-executar um run antigo republicaria o
      # código daquele commit por cima do atual; num re-run, só segue se a main
      # ainda estiver neste commit.
      - name: Re-run só publica o commit atual da main
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            HEAD_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
            if [ "$HEAD_MAIN" != "$GITHUB_SHA" ]; then
              echo "::error::a main já está em $HEAD_MAIN; este run é de $GITHUB_SHA e não republica a imagem"
              exit 1
            fi
          fi

      - name: Gerar metadados da imagem
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ secrets.GIT_REGISTRY }}/${{ secrets.GIT_OWNER }}/b3datetime
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      - name: Login no Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.GIT_REGISTRY_USER }}
          password: ${{ secrets.GIT_REGISTRY_PASSWORD }}
          registry: ${{ secrets.GIT_REGISTRY }}

      - name: Habilitar QEMU (multi-arquitetura)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Mesma APK_REFRESH do docker-verify: o amd64 reaproveita a camada escaneada
      # (escopo verify) e o arm64 reaproveita as próprias camadas (escopo publish).
      - name: Construir e enviar imagem multi-arch
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APK_REFRESH=${{ needs.docker-verify.outputs.apk-refresh }}
          cache-from: |
            type=gha,scope=verify
            type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish

  release:
    name: Entrega · release
    timeout-minutes: 15
    # Release automática: quando a api_version do commit publicado ainda não tem
    # Release, cria a tag vX.Y.Z neste commit, retagueia a imagem recém-publicada
    # e publica a Release com a seção do CHANGELOG. Numa versão já publicada, não
    # faz nada. Substitui o antigo release.yml disparado por tag, que exigia enviar
    # a tag só depois de o CI publicar sha-<7> e repetia checagens que os testes de
    # tests/unit/test_config.py já fazem antes de qualquer publicação (#41).
    # Fica fora do ci-ok: roda depois da publicação.
    needs: [docker-publish]
    # Mesma razão do docker-publish: sem condição explícita, o skipped transitivo do
    # dependency-review pularia a release.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.docker-publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Versão e estado da Release
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(grep -oE 'api_version: str = "[^"]+"' src/b3datetime/config.py | cut -d'"' -f2)"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::api_version '$V' não é SemVer"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Só a mensagem exata "release not found" significa que não existe. Uma
          # falha passageira da API não pode ser lida como "criar" e mover tags.
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>gh-err.txt; then
            echo "Release v$V já publicada; nada a fazer."
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -qx 'release not found' gh-err.txt; then
            echo "::error::falha ao consultar a Release v$V: $(cat gh-err.txt)"
            exit 1
          fi
          # Tag sem Release (execução interrompida no meio): só segue se a tag
          # apontar para este commit. Tag anotada precisa do ^{} para chegar ao
          # commit; tag leve (criada pela API) aponta direto.
          TAG_SHA="$(git ls-remote origin "refs/tags/v$V^{}" | cut -f1)"
          [ -n "$TAG_SHA" ] || TAG_SHA="$(git ls-remote origin "refs/tags/v$V" | cut -f1)"
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::a tag v$V já existe e aponta para $TAG_SHA, não para $GITHUB_SHA"
            exit 1
          fi
          echo "create=true" >> "$GITHUB_OUTPUT"

      - name: Notas do CHANGELOG
        if: steps.v.outputs.create == 'true'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          awk -v v="$V" '
            $0 ~ "^## \\["v"\\]" {f=1; next}
            f && /^## \[/ {exit}
            f
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::a seção do CHANGELOG para $V está vazia"
            exit 1
          fi
          echo "--- notas extraídas ---"; head -40 release-notes.md

      - name: Login no Container Registry
        if: steps.v.outputs.create == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.GIT_REGISTRY }}
          username: ${{ secrets.GIT_REGISTRY_USER }}
          password: ${{ secrets.GIT_REGISTRY_PASSWORD }}

      - name: Instalar crane
        if: steps.v.outputs.create == 'true'
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      # `crane tag` adiciona uma tag ao manifest existente dentro do mesmo
      # repositório: preserva a lista multi-arch, não copia blob nenhum e leva
      # segundos. Foi escolhido em vez de `buildx imagetools create` porque este
      # consulta a API de referrers da OCI, que este registry não implementa
      # (responde 502 em /v2/.../referrers/...). A origem é o digest que o
      # docker-publish acabou de enviar neste mesmo run, e não uma tag: não há
      # ordem a respeitar nem imagem de outro commit possível. O nome da imagem é
      # montado aqui porque outputs de job que contêm secret são descartados.
      - name: Retaguear a imagem com o semver
        if: steps.v.outputs.create == 'true'
        env:
          IMAGE: ${{ secrets.GIT_REGISTRY }}/${{ secrets.GIT_OWNER }}/b3datetime
          DIGEST: ${{ needs.docker-publish.outputs.digest }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::digest inválido vindo do docker-publish: '$DIGEST'"
            exit 1
          fi
          # X.Y e X só para versões finais; pré-release recebe apenas a própria tag.
          TAGS="$V"
          if [[ "$V" != *-* ]]; then
            TAGS="$TAGS ${V%.*} ${V%%.*}"
          fi
          for t in $TAGS; do
            echo "-> $t"
            crane tag "$IMAGE@$DIGEST" "$t"
          done

      # Cria a tag vX.Y.Z neste commit (pela API) e a Release. Tags criadas com o
      # GITHUB_TOKEN não disparam workflows, e nenhum workflow reage a tags.
      - name: Publicar a Release
        if: steps.v.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          PRE=()
          if [[ "$V" == *-* ]]; then PRE=(--prerelease); fi
          gh release create "v$V" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$V" --notes-file release-notes.md "${PRE[@]}"

  sbom:
    name: Entrega · SBOM
    timeout-minutes: 10
    needs: [docker-publish]
    if: ${{ !cancelled() && needs.docker-publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json

  ci-ok:
    name: CI OK
    timeout-minutes: 5
    # Agregador: é este o único check que precisa ser exigido em branch
    # protection, em vez de enumerar uma dúzia de nomes de job.
    if: always()
    needs:
      - lint
      - typecheck
      - test
      - sonar
      - bandit
      - pip-audit
      - dependency-review
      - secret-scan
      - codeql
      - trivy-fs
      - docker-verify
      - e2e
    runs-on: ubuntu-latest
    steps:
      # O JSON chega por variável de ambiente, nunca interpolado no script: `${{ }}`
      # dentro de `run:` é injeção de template (zizmor).
      #
      # `skipped` só é aceito onde o pulo é o desenho: dependency-review roda só em PR,
      # e sonar é pulado em PR do Dependabot e de fork (sem secrets). Em push nada
      # disso se aplica — e como o docker-publish depende deste job, aceitar um
      # `skipped` qualquer em push deixaria publicar sem o bloco ter rodado.
      - name: Verificar resultado dos jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          evento = os.environ["EVENT_NAME"]
          pulo_aceito = {"dependency-review"} if evento == "push" else {"dependency-review", "sonar"}

          # Rótulo de cada bloco no resumo do run, na ordem do pipeline.
          blocos = {
              "lint": "Lint · ruff",
              "typecheck": "Tipagem · mypy",
              "bandit": "SAST · bandit",
              "codeql": "SAST · CodeQL",
              "secret-scan": "Segredos · gitleaks",
              "pip-audit": "SCA · pip-audit",
              "trivy-fs": "SCA · Trivy (filesystem)",
              "dependency-review": "SCA · dependency-review",
              "test": "Testes · pytest",
              "sonar": "Qualidade · SonarQube",
              "docker-verify": "Imagem · build, smoke e Trivy",
              "e2e": "E2E · contrato 100%",
          }
          icone = {"success": "✅", "skipped": "⏭️", "failure": "❌", "cancelled": "🚫"}

          ruim = {}
          for nome, r in needs.items():
              res = r["result"]
              if res == "success" or (res == "skipped" and nome in pulo_aceito):
                  continue
              ruim[nome] = res

          linhas = ["## Blocos do pipeline", "", "| Bloco | Job | Resultado |", "|---|---|---|"]
          for nome in sorted(needs, key=lambda n: list(blocos).index(n) if n in blocos else len(blocos)):
              res = needs[nome]["result"]
              linhas.append(f"| {blocos.get(nome, nome)} | `{nome}` | {icone.get(res, '❔')} {res} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(linhas) + "\n")

          for nome, resultado in sorted(ruim.items()):
              print(f"::error::job '{nome}' terminou como {resultado}")
          if ruim:
              sys.exit(1)
          print(f"Todos os jobs obrigatórios passaram ({evento}).")
          PY
