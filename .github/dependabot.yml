version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # Cooldown contra cadeia de suprimentos: versão recém-publicada só é proposta depois
    # de 7 dias, a janela em que releases comprometidas costumam ser descobertas e
    # retiradas (zizmor: dependabot-cooldown).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    # Minor e patch vêm num único PR semanal. Com um PR por pacote, os cinco slots
    # de open-pull-requests-limit se esgotaram e o Dependabot parou de propor
    # atualizações: starlette, uvicorn e pandas ficaram represados (#40). Majors
    # continuam em PRs próprios, porque pedem leitura do changelog.
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # A base é python:3.14-alpine fixada por digest: o que chega aqui são os digests
  # novos da mesma tag (patches do Python e do Alpine), testados pelo CI no PR antes
  # de serem adotados. Trocar de Python (3.15) é decisão deliberada — mexe na matriz
  # do CI, em sonar.python.version e na documentação —, por isso minor e major são
  # ignorados.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    # Também 7 dias para o digest da base: as correções de segurança do Alpine já entram
    # a cada build pelo `apk upgrade` (APK_REFRESH), então o atraso custa pouco.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
