version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"

  # A base é python:3.14-alpine fixada por digest: o que chega aqui são os digests
  # novos da mesma tag (patches do Python e do Alpine), testados pelo CI no PR antes
  # de serem adotados. Trocar de Python (3.15) é decisão deliberada — mexe na matriz
  # do CI, em sonar.python.version e na documentação —, por isso minor e major são
  # ignorados.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
